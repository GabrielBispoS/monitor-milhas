name: Monitor de Milhas — Diário 08h00

on:
  schedule:
    # 08h00 BRT = 11h00 UTC
    - cron: "0 11 * * *"
  workflow_dispatch:

jobs:
  monitorar:
    runs-on: ubuntu-22.04   # Ubuntu 22.04 — compatível com libasound2

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4.2.2

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.12"

      - name: Instalar dependências Python
        run: pip install -r requirements.txt

      - name: Instalar Chromium (Playwright)
        run: python -m playwright install chromium --with-deps

      - name: Executar monitor
        env:
          EVOLUTION_API_URL:  ${{ secrets.EVOLUTION_API_URL }}
          EVOLUTION_API_KEY:  ${{ secrets.EVOLUTION_API_KEY }}
          EVOLUTION_INSTANCE: ${{ secrets.EVOLUTION_INSTANCE }}
          WHATSAPP_NUMBER:    ${{ secrets.WHATSAPP_NUMBER }}
        run: python src/monitor.py
